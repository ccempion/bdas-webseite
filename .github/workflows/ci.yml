name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # pnpm 11.x requires node:sqlite (Node 22.5+). Node 20 makes setup-node's
  # `cache: pnpm` step crash before any job runs. Matches local (v22.x).
  NODE_VERSION: "22"
  PNPM_VERSION: "11.0.9"

jobs:
  static:
    name: Lint, typecheck, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bdas
          POSTGRES_PASSWORD: bdas
          POSTGRES_DB: bdas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bdas -d bdas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://bdas:bdas@localhost:5432/bdas
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # ADR 0002: a token minted by the TS issuer must verify through the real
      # PHP plugin parser. `pnpm test` writes the freshly minted token; this
      # step reads it back through wp-plugin/bdas-sso/src/jwt.php. Same job, so
      # the artifact is on disk. ubuntu-latest ships the PHP CLI.
      - name: SSO issuer ↔ verifier contract (PHP)
        run: php wp-plugin/bdas-sso/test/verify-fixture.php

  migrate-dry-run:
    name: Migrations dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:dry

  web-build:
    name: Web app production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bdas/web build
